<!doctype html><html lang="zh-CN" data-quality="high"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCEAN 动效目录 · 合成示例</title><link rel="stylesheet" href="/css/ocean.css"></head><body>
<main class="motion-demo"><p class="eyebrow">OCEAN · 动效目录</p><h1>动作、节奏与回响。</h1><p>全部为合成视觉示例，不创建房间，不连接Socket，不演示真实战斗结果。</p>
<div class="demo-controls"><label>示例<select id="demo-action"></select></label><label>表现<select id="demo-quality"><option value="high">高画质</option><option value="smooth">流畅</option><option value="reduced">减少动画</option></select></label><label>合法结果<select id="demo-result"><option value="unknown">中性 / 结果保密</option><option value="hit">公开命中</option><option value="miss">公开未中</option><option value="private-positive">区域有信号</option><option value="private-negative">区域无信号</option></select></label><button id="demo-play">播放一次</button><button id="demo-cancel">立即取消</button></div>
<section class="demo-stage" aria-label="合成效果示例海域"><div id="demo-layer"></div><strong id="demo-badge">训练示例</strong></section><p id="demo-metrics">主效果0 / 1 · 装饰节点0 / 80 · 粒子0 · 排队0</p><p id="demo-status" role="status">选取行动并播放，减少动画保留静态说明。</p>
<details><summary>页面与状态示例</summary><p>此处只演示局部视觉节奏；正式触发和权限需在真实页面验证。</p><button data-example="control">首页/操作区进入</button><button data-example="seat">等待座位变化</button><button data-example="lock">部署选舰</button><button data-example="deploy">部署落位</button><button data-example="deploy">随机部署/准备</button><button data-example="dice">服务器骰子结果</button><button data-example="turn">回合交接</button><button data-example="lock">行动/目标准线</button><button data-example="control">提交状态</button><button data-example="marker">私人标记</button><button data-example="layer">切图/切层</button><button data-example="hp">己方HP</button><button data-example="paralysis">己方瘫痪/解除</button><button data-example="sunk">己方沉没</button><button data-example="decoy">己方鱼雷失效</button><button data-example="resource">资源消耗</button><button data-example="tutorial">教程步骤完成</button><button data-example="salvo">齐射一轮完成</button><button data-example="result">胜负徽记</button><button data-example="connection">连接状态</button><button id="demo-dialog-open">抽屉/对话框</button></details>
<dialog id="demo-dialog"><h2>对话框示例</h2><p>原有实体面板与短过渡，不改变事实或焦点。</p><button id="demo-dialog-close">关闭</button></dialog>
</main><script src="/catalog.js"></script><script src="/motion-runtime.js"></script></body></html>
