<!doctype html><html lang="zh-CN" data-theme="armory-ember" data-quality="high"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCEAN · 军械库组件与效果样板</title><link rel="stylesheet" href="/css/ocean.css"><link rel="stylesheet" href="/css/armory-lab.css"><script src="/js/release-config.js" defer></script><script src="/js/game-data.js" defer></script><script src="/js/armory-lab-config.js" defer></script><script src="/js/armory-lab.js" defer></script></head><body><main class="armory-lab"><p class="eyebrow">UI SPEC 2.0 · 合成样板</p><h1>黑潮军械库</h1><p>此页只展示组件与中性效果，不创建房间、不连接 Socket、不读取凭证。实际行为请进入训练营。</p><nav class="lab-controls" aria-label="样板设置"><label>主题<select id="lab-theme"><option value="armory-ember">炉火</option><option value="armory-cast">冷铸</option><option value="armory-ivory">铸白</option></select></label><label>表现<select id="lab-quality"><option value="high">高画质</option><option value="smooth">流畅</option><option value="reduced">减少动画</option></select></label><a href="/">回到游戏</a></nav><section class="lab-components"><h2>组件状态</h2><div class="lab-state-row"><button class="button button--primary">主操作 · 默认</button><button aria-pressed="true">已选择</button><button disabled>来源沉没 · 禁用</button><button class="button button--danger">风险确认</button><button aria-busy="true">正在提交…</button></div><label class="field">输入与错误<input value="舰长" aria-describedby="lab-error" aria-invalid="true"><small id="lab-error" class="form-error">示例：昵称长度不符合要求。</small></label><div class="lab-seals" aria-label="四种结果章面"><img src="/assets/icons/armory-seal-win.svg" alt="胜利章"><img src="/assets/icons/armory-seal-loss.svg" alt="失败章"><img src="/assets/icons/armory-seal-draw.svg" alt="平局章"><img src="/assets/icons/armory-seal-canceled.svg" alt="取消封存章"></div></section><section><h2>十行动 · 实际格尺度</h2><p>40px 格，中心单格效果高档 112px / 流畅 100px。区域与整行效果覆盖真实示例范围。仅使用中性授权输入，不代表命中、伤害或敌方舰位。</p><div id="lab-weapons" class="lab-weapons"></div><div class="lab-map" aria-label="合成海图"><div id="lab-grid"></div><div id="lab-effect" aria-hidden="true"></div><p id="lab-status" role="status">选择一种行动以播放一次。</p></div></section></main></body></html>
